dev-events-annual-tech-conference-site:
    name: Annual Tech Conference Site
    oAuthApplicationHeadlessServer: dev-events-annual-tech-conference-oauth
    siteExternalReferenceCode: annual-tech-conference
    siteName: Annual Tech Conference
    type: siteInitializer

dev-events-annual-tech-conference-oauth:
    .serviceAddress: localhost:8080
    .serviceScheme: http
    name: Annual Tech Conference Site OAuth
    scopes:
        - Liferay.Headless.Admin.Site.everything
        - Liferay.Headless.Admin.Content.everything
        - Liferay.Object.Admin.REST.everything
        - Liferay.Headless.Object.everything
        - Liferay.Headless.Admin.User.everything
    type: oAuthApplicationHeadlessServer