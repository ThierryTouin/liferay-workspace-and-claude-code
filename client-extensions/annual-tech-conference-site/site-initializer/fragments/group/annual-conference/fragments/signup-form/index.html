<section aria-label="Event signup" class="conference-signup-wrapper conference-signup--${configuration.theme!'dark'}" data-layout="${configuration.layout!'split'}" data-show-company="${(configuration.showCompany!true)?c}" data-show-dietary="${(configuration.showDietary!true)?c}" data-submit-label="${configuration.submitLabel!'Reserve my seat'}">
	<div class="conference-signup-intro">
		<p class="conference-signup-intro__eyebrow" data-lfr-editable-id="eyebrow" data-lfr-editable-type="text">SAVE YOUR SEAT</p>

		<h1 class="conference-signup-intro__title" data-lfr-editable-id="title" data-lfr-editable-type="text">Join the conversation</h1>

		<div class="conference-signup-intro__lead" data-lfr-editable-id="lead" data-lfr-editable-type="rich-text">
			<p>Pick the session you want, tell us who you are, and we will hold a place for you.</p>
		</div>
	</div>

	<form class="conference-signup-form" data-signup-form>
		<label class="conference-field">
			<span class="conference-field__label">Which event?</span>
			<select class="conference-field__control" data-event-select name="eventId" required>
				<option value="">Loading events&hellip;</option>
			</select>
		</label>

		<label class="conference-field">
			<span class="conference-field__label">Your name</span>
			<input autocomplete="name" class="conference-field__control" name="attendeeName" required type="text" />
		</label>

		<label class="conference-field">
			<span class="conference-field__label">Email address</span>
			<input autocomplete="email" class="conference-field__control" name="email" required type="email" />
		</label>

		<label class="conference-field" data-optional-field="company">
			<span class="conference-field__label">Company</span>
			<input autocomplete="organization" class="conference-field__control" name="company" required type="text" />
		</label>

		<label class="conference-field" data-optional-field="dietary">
			<span class="conference-field__label">Dietary requirement</span>
			<select class="conference-field__control" name="dietaryRequirement" required>
				<option value="none">No requirements</option>
				<option value="vegetarian">Vegetarian</option>
				<option value="vegan">Vegan</option>
				<option value="halal">Halal</option>
				<option value="kosher">Kosher</option>
				<option value="glutenFree">Gluten-free</option>
				<option value="other">Other</option>
			</select>
		</label>

		<button class="conference-signup-form__submit" data-submit-button type="submit">Reserve my seat</button>

		<p class="conference-form-status" data-form-status role="status"></p>
	</form>
</section>
